[project]
name = "pyxelquest"
version = "1.0.0"
description = "A terminal RPG engine demonstrating Claude Code's capabilities"
requires-python = ">=3.10"
dependencies = ["rich>=13.0.0"]

[project.scripts]
pixelquest = "game:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
